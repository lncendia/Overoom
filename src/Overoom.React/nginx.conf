server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Не раскрываем версию nginx
    server_tokens off;

    # Gzip для производительности (woff2 уже сжат, поэтому не указан)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        image/x-icon
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Заголовки безопасности задаются в каждом location, так как add_header внутри location
    # отменяет наследование заголовков с уровня server

    # Хешированные файлы сборки Vite: кэшируются навсегда
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Точка входа SPA: всегда проверяется актуальность
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Конфигурация приложения (может монтироваться при запуске контейнера): не кэшируется
    location = /configuration.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Прочая статика без хеша в имени (playerjs.js, изображения, аудио, шрифты):
    # короткое кэширование, отсутствующие файлы возвращают 404, а не index.html
    location ~* \.(?:js|mjs|css|map|json|txt|xml|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|eot|mp4|webm|mp3|wav|ogg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Навигация SPA: все остальные адреса отдают index.html
    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
